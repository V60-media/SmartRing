<!DOCTYPE html>
<html lang="en" data-typescale="figma">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SeeMyHealth — Empower your daily health</title>
<meta name="description" content="SeeMyHealth smart ring, app and connected devices: clarity for your body, every day.">
<link rel="preload" href="assets/fonts/OverusedGrotesk-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/OverusedGrotesk-Medium.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="site.css">
<script>/* hide hero/nav until the entrance intro plays (home only, motion allowed); app.js removes it */
(function(){var h=(location.hash||"#home").slice(1);if((h===""||h==="home")&&!matchMedia("(prefers-reduced-motion: reduce)").matches){var d=document.documentElement;d.classList.add("intro-pending");setTimeout(function(){d.classList.remove("intro-pending")},3000);}})();</script>
</head>
<body>
<a class="sr-only" href="#app">Skip to content</a>
<div id="app">
{{pages}}
</div>
{{> overlays}}
<!-- QC: typescale switch (Cmd/Ctrl + \). Remove before final hand-off. -->
<div class="dev-panel" aria-label="Temp control panel" hidden>
  <div class="dev-panel__head"><strong>Control panel</strong><kbd>⌘\</kbd></div>
  <div class="ts-switch" role="group" aria-label="Typescale">
    <button type="button" data-typescale-set="figma" aria-pressed="true">Figma</button>
    <button type="button" data-typescale-set="normalized" aria-pressed="false">Normalized</button>
  </div>
  <label class="dev-panel__row">Hero scroll speed <output data-hero-speed-out>80%</output>
    <input type="range" min="0" max="150" step="5" value="80" data-hero-speed>
  </label>
  <label class="dev-panel__row">Benefits text rise <output data-kb-speed-out>15%</output>
    <input type="range" min="0" max="60" step="1" value="15" data-kb-speed>
  </label>
</div>
<script>window.ROUTE_META = {{routeMeta}};</script>
<script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="app.js"></script>
<script type="module" src="https://liquidglass.dev/lib/components.js"></script>
</body>
</html>
